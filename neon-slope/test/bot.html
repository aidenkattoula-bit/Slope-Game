<!doctype html>
<meta charset="utf-8">
<title>bot test</title>
<pre id="out">running…</pre>
<script type="module">
// Browser version of test/bot.mjs (used when Node isn't installed).
import { TrackGenerator } from '../src/track.js';
import { Sim, botSteer } from '../src/physics.js';
import { DZ } from '../src/config.js';
const out = [];
const sig = (seed) => { const g = new TrackGenerator(seed); g.ensure(800);
  return g.rows.map((r) => `${r.x.toFixed(3)},${r.y.toFixed(3)},${r.hw.toFixed(3)},${r.solid},${r.obs.length}`).join('|'); };
out.push(`deterministic: ${sig('FUN42') === sig('FUN42')}  different seeds differ: ${sig('FUN42') !== sig('FUN43')}`);
const MAX = Number(new URLSearchParams(location.search).get('dist') || 7000);
const results = [], crashes = {};
for (let n = 0; n < 40; n++) {
  const gen = new TrackGenerator('T' + n), sim = new Sim(gen); let t = 0;
  while (sim.alive && sim.distance < MAX && t < 400) {
    gen.ensure(Math.floor(-sim.ball.z / DZ) + 160);
    sim.update(1 / 60, botSteer(sim)); t += 1 / 60;
  }
  if (!sim.alive) crashes[sim.crash] = (crashes[sim.crash] || 0) + 1;
  results.push({ seed: 'T' + n, dist: Math.round(sim.distance), crash: sim.alive ? 'survived' : sim.crash, score: Math.floor(sim.score) });
}
results.sort((a, b) => a.dist - b.dist);
out.push(JSON.stringify(results.slice(0, 12)));
out.push(`crash types: ${JSON.stringify(crashes)}  survived: ${results.filter((r) => r.crash === 'survived').length}/40`);
document.getElementById('out').textContent = out.join('\n');
window.DONE = out.join('\n');
</script>
